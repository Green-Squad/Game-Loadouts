name: Rust public experiment
on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: loadouts_fixture
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=2s --health-timeout=2s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app
      - name: Prepare isolated fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql --protocol=tcp -h 127.0.0.1 -P 3307 -u root < rust-app/fixtures/schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3307 -u root < rust-app/fixtures/data.sql
      - name: Rust formatting, lint, unit and database tests
        env:
          TEST_DATABASE_URL: mysql://root@127.0.0.1:3307/loadouts_fixture
        run: |
          cargo fmt --manifest-path rust-app/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust-app/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path rust-app/Cargo.toml -- --include-ignored
      - name: Container build and runtime smoke test
        run: |
          docker build --pull -t game-loadouts-rust:test .
          docker image inspect game-loadouts-rust:test --format '{{.Size}}' > image-size-bytes.txt
          docker run --detach --name rust-smoke --network host --read-only --cap-drop ALL \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3307 -e DB_DATABASE=loadouts_fixture \
            -e DB_USERNAME=loadouts_reader -e METRICS_HEADERS=1 game-loadouts-rust:test
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl --fail http://127.0.0.1:8080/ > home.html
          curl --fail http://127.0.0.1:8080/Call+of+Duty+Modern+Warfare/M4A1 > weapon.html
          curl --fail --head http://127.0.0.1:8080/css/styles.min.css > static-headers.txt
          npm install --no-save --ignore-scripts playwright@1.64.0
          npx playwright install --with-deps chromium
          SCREENSHOT_DIR=browser-screenshots node rust-app/tools/browser_smoke.mjs
          docker stop --time 10 rust-smoke
          test "$(docker inspect rust-smoke --format '{{.State.ExitCode}}')" = 0
          docker logs rust-smoke > container-log.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: rust-validation
          path: |
            image-size-bytes.txt
            home.html
            weapon.html
            static-headers.txt
            container-log.jsonl
            browser-screenshots/
