name: Rust public experiment
on:
  push:
    branches: [rust, master]
  pull_request:
    branches: [rust, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      TURSO_TEST_DATABASE: isolated
      TEST_TURSO_PUBLIC_URL: http://127.0.0.1:8083
      TEST_TURSO_ACCOUNTS_URL: http://127.0.0.1:8084
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: loadouts_fixture
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=2s --health-timeout=2s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app
          cache-on-failure: true
      - name: Prepare isolated fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql --default-character-set=utf8mb4 --protocol=tcp -h 127.0.0.1 -P 3307 -u root < rust-app/fixtures/schema.sql
          mysql --default-character-set=utf8mb4 --protocol=tcp -h 127.0.0.1 -P 3307 -u root < rust-app/fixtures/data.sql
          pip install -r rust-app/migration/requirements.txt
          docker run -d --name fixture-public -p 8083:8080 ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
          docker run -d --name fixture-accounts -p 8084:8080 ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
          docker run -d --name fixture-sync -p 8085:8080 ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
          python rust-app/migration/fixture_copy.py --source-database loadouts_fixture --target "$TEST_TURSO_PUBLIC_URL"
          SYNC_TEST_URL=http://127.0.0.1:8085 python -m unittest discover -s rust-app/migration -p 'test_*.py' -v
      - name: Prepare Chromium for interactive fixture checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Rust formatting, lint, unit and database tests
        env:
          RUN_BROWSER_TESTS: "1"
          TEST_DATABASE_URL: mysql://root@127.0.0.1:3307/loadouts_fixture
        run: |
          cargo fmt --manifest-path rust-app/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust-app/Cargo.toml --features fixture-tests --all-targets -- -D warnings
          cargo test --locked --manifest-path rust-app/Cargo.toml --features fixture-tests -- --include-ignored
      - name: Container build and runtime smoke test
        run: |
          docker build --pull -t game-loadouts-rust:test .
          docker image inspect game-loadouts-rust:test --format '{{.Size}}' > image-size-bytes.txt
          docker run --detach --name rust-smoke --network host --read-only --cap-drop ALL \
            -e TURSO_DATABASE_URL="$TEST_TURSO_PUBLIC_URL" -e TURSO_AUTH_TOKEN= -e TURSO_TEST_DATABASE -e METRICS_HEADERS=1 -e DISQUS_ENABLED=0 game-loadouts-rust:test
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl --fail http://127.0.0.1:8080/ > home.html
          curl --fail http://127.0.0.1:8080/Call+of+Duty+Modern+Warfare/M4A1 > weapon.html
          curl --fail --head http://127.0.0.1:8080/css/styles.min.css > static-headers.txt
          SCREENSHOT_DIR=browser-screenshots node rust-app/tools/browser_smoke.mjs
          docker stop --time 10 rust-smoke
          test "$(docker inspect rust-smoke --format '{{.State.ExitCode}}')" = 0
          docker logs rust-smoke > container-log.jsonl
          # Check the unchanged Laravel schema and encrypted-cookie account startup using only fixtures.
          docker run --rm --network host --read-only --cap-drop ALL \
            -e TURSO_DATABASE_URL="$TEST_TURSO_PUBLIC_URL" -e TURSO_AUTH_TOKEN= -e TURSO_TEST_DATABASE game-loadouts-rust:test --check-public-schema
          docker run --detach --name rust-account-smoke --network host --read-only --cap-drop ALL \
            -e PORT=8081 -e TURSO_DATABASE_URL="$TEST_TURSO_PUBLIC_URL" -e TURSO_AUTH_TOKEN= -e TURSO_TEST_DATABASE -e TURSO_WRITE_TOKEN= \
            -e INTERACTIVE_ENABLED=1 -e ACCOUNT_BASE_URL=https://rust.gameloadouts.com \
            -e KEY=synthetic-session-key-32-bytes-long \
            -e MAIL_USERNAME=fixture@example.invalid -e MAIL_PASSWORD=synthetic-fixture-password \
            -e RECAPTCHA_PRIVATE_KEY=synthetic-fixture-secret -e DISQUS_ENABLED=0 game-loadouts-rust:test
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:8081/healthz && break; sleep 1; done
          curl --fail --dump-header account-headers.txt http://127.0.0.1:8081/login > account-login.html
          grep -q 'gameloadouts_rust_session=' account-headers.txt
          grep -q 'HttpOnly; SameSite=Lax' account-headers.txt
          grep -q '; Secure' account-headers.txt
          grep -q 'name="_token"' account-login.html
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --data '' http://127.0.0.1:8081/login)" = 403
          docker stop --time 10 rust-account-smoke
          test "$(docker inspect rust-account-smoke --format '{{.State.ExitCode}}')" = 0
          docker logs rust-account-smoke > account-container-log.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-validation
          path: |
            image-size-bytes.txt
            home.html
            weapon.html
            static-headers.txt
            container-log.jsonl
            account-container-log.jsonl
            account-login.html
            account-headers.txt
            browser-screenshots/
