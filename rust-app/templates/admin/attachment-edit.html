

<div class="row">
    <div class="col-lg-12">
        <h1>{{ attachment.field("name") }} <small>Edit</small></h1>
        <ol class="breadcrumb">
            <li>
                <i class="fa fa-dashboard"></i>
                <a href="{{ self.url("adminDashboard", &game.field("id"), &weapon.field("name"), &attachment.field("id"), &loadout.field("id"), &user.field("email")) }}">
                    Dashboard
                </a>
            </li>
            <li>
                <i class="icon-file-alt"></i>
                <a href="{{ self.url("admin.game.index", &game.field("id"), &weapon.field("name"), &attachment.field("id"), &loadout.field("id"), &user.field("email")) }}">
                    Games
                </a>
            </li>
            <li>
                <i class="icon-file-alt"></i>
                <a href="{{ self.url("GameController@show", &game.field("id"), &weapon.field("name"), &attachment.field("id"), &loadout.field("id"), &user.field("email")) }}">
                    {{ game.field("id") }}
                </a>
            </li>
            <li>
                <i class="icon-file-alt"></i>
                <a href="#">
                    {{ attachment.field("name") }}
                </a>
            </li>
            <li class="active">
                <i class="icon-file-alt"></i> Edit
            </li>
        </ol>
    </div>
</div><!-- /.row -->

<div class="row">
    <div class="col-lg-7">
        <div class="well">
            <form method="post" action="{{ form_action }}" class="form-horizontal" enctype="multipart/form-data"><input type="hidden" name="_token" value="{{ session.csrf }}">{% if !form_method.is_empty() %}<input type="hidden" name="_method" value="{{ form_method }}">{% endif %}
            <fieldset>
                <div class="form-group">
                    <div class="col-lg-12">
                        <input type="text" name="name" id="name" value="{{ attachment.field("name") }}" class="form-control input-lg" placeholder="Game Name" required="">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <input type="text" name="slot" id="slot" value="{{ attachment.field("slot") }}" class="form-control input-lg" placeholder="Attachment Slot Number" required="">
                    </div>
                </div>
                <div class="form-group">
                    {% if !attachment.field("thumb_url").is_empty() %}
                    <div class="col-lg-2">
                        <img src="{{ self.asset(&attachment.field("thumb_url")) }}" alt="{{ attachment.field("name") }}" />
                        <a href="{{ self.url("AttachmentController@removeImage", &game.field("id"), &weapon.field("name"), &attachment.field("id"), &loadout.field("id"), &user.field("email")) }}" class="btn btn-danger">
                            <span class="glyphicon glyphicon-trash"></span>
                        </a>
                    </div>
                    {% endif %}
                    <div class="col-lg-10">
                        <label for="image" class="control-label">{{ "Upload Image: " }}</label>
                        <input type="file" name="image" id="image" class="form-control input-lg">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                    </div>
                </div>
            </fieldset>
            </form>
        </div>
    </div>
</div>
