
<div class="row">
    <div class="col-lg-12">
        <h1>Game <small>Create New</small></h1>
        <ol class="breadcrumb">
            <li>
                <i class="fa fa-dashboard"></i> Dashboard
            </li>
            <li>
                <i class="icon-file-alt"></i> Game
            </li>
            <li class="active">
                <i class="icon-file-alt"></i> Create
            </li>
        </ol>
    </div>
</div><!-- /.row -->

<div class="row">
    <div class="col-lg-7">
        <div class="well">
            <form method="post" action="{{ form_action }}" class="form-horizontal" enctype="multipart/form-data"><input type="hidden" name="_token" value="{{ session.csrf }}">{% if !form_method.is_empty() %}<input type="hidden" name="_method" value="{{ form_method }}">{% endif %}
            <fieldset>
                <legend>
                    <h2>Create Game</h2>
                </legend>
                <div class="form-group">
                    <div class="col-lg-7">
                        <input type="text" name="id" id="id" value="{{ "" }}" class="form-control input-lg" placeholder="Game Name" required="">
                    </div>
					<div class="col-lg-5">
                        <input type="text" name="short_name" id="short_name" value="{{ "" }}" class="form-control input-lg" placeholder="Short Name">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-6">
                        <select name="theme_color" id="theme_color" class="form-control input-lg" placeholder="Theme Color" required=""><option value="cyan"{% if "" == "cyan" %} selected{% endif %}>Cyan</option><option value="green"{% if "" == "green" %} selected{% endif %}>Green</option><option value="orange"{% if "" == "orange" %} selected{% endif %}>Orange</option><option value="red"{% if "" == "red" %} selected{% endif %}>Red</option><option value="yellow"{% if "" == "yellow" %} selected{% endif %}>Yellow</option></select>
                    </div>
                    <div class="col-lg-6">
                        <input type="text" name="live" id="live" value="{{ "0" }}" class="form-control input-lg" placeholder="Live" required="">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <label for="image" class="control-label">{{ "Upload Small Image (525 x 179 minimum): " }}</label>
                        <input type="file" name="image" id="image" class="form-control input-lg">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <label for="header_image" class="control-label">{{ "Upload Header Image (1500 x 215 minimum): " }}</label>
                        <input type="file" name="header_image" id="header_image" class="form-control input-lg">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                    </div>
                </div>
            </fieldset>
            </form>
        </div>
    </div>
</div><!-- /.row -->
