

<div class="row">
    <div class="col-lg-12">
        <h1>Import</h1>
        <ol class="breadcrumb">
            <li>
                <i class="fa fa-dashboard"></i>
                <a href="{{ self.url("adminDashboard", &game.field("id"), &weapon.field("name"), &attachment.field("id"), &loadout.field("id"), &user.field("email")) }}">
                    Dashboard
                </a>
            </li>
            <li>
                <i class="icon-file-alt"></i>
                <a href="{{ self.url("admin.game.index", &game.field("id"), &weapon.field("name"), &attachment.field("id"), &loadout.field("id"), &user.field("email")) }}">
                    Games
                </a>
            </li>
            <li>
                <i class="icon-file-alt"></i>
                <a href="{{ self.url("GameController@show", &game.field("id"), &weapon.field("name"), &attachment.field("id"), &loadout.field("id"), &user.field("email")) }}">
                    {{ game.field("id") }}
                </a>
            </li>
            <li class="active">
                <i class="icon-file-alt"></i> Import
            </li>
        </ol>
    </div>
</div><!-- /.row -->
<div class="row">
    <div class="col-lg-7">
        <div class="well">
            <form method="post" action="{{ form_action }}" class="form-horizontal" enctype="multipart/form-data"><input type="hidden" name="_token" value="{{ session.csrf }}">{% if !form_method.is_empty() %}<input type="hidden" name="_method" value="{{ form_method }}">{% endif %}
            <fieldset>
                <div class="form-group">
                    <div class="col-lg-12">
                        <label for="Spreadsheet" class="control-label">{{ "Upload Spreadsheet: " }}</label>
                        <input type="file" name="spreadsheet" id="spreadsheet" class="form-control input-lg">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <button type="submit" class="btn btn-primary">
                            Import
                        </button>
                    </div>
                </div>
            </fieldset>
            </form>
        </div>
    </div>
    <div class="col-lg-5">
        <div class="well">
        <p>The import requires a .csv file in a certain format.</p>
        <p><strong><a href="/files/import example.csv">Download example file.</a></strong></p>
        </div>
    </div>
</div>
