
<div class="row">
    <div class="col-lg-12">
        <h1>User <small>Create New</small></h1>
        <ol class="breadcrumb">
            <li>
                <i class="fa fa-dashboard"></i> Dashboard
            </li>
            <li>
                <i class="icon-file-alt"></i> User
            </li>
            <li class="active">
                <i class="icon-file-alt"></i> Create
            </li>
        </ol>
    </div>
</div><!-- /.row -->

<div class="row">
    <div class="col-lg-7">
        <div class="well">
            <form method="post" action="{{ form_action }}" class="form-horizontal"><input type="hidden" name="_token" value="{{ session.csrf }}">{% if !form_method.is_empty() %}<input type="hidden" name="_method" value="{{ form_method }}">{% endif %}
            <fieldset>
                <legend>
                    <h2>Create User</h2>
                </legend>
                <div class="form-group">
                    <div class="col-lg-12">
                        <input type="text" name="username" id="username" value="{{ "" }}" class="form-control input-lg" placeholder="Username" required="">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <input type="email" name="email" id="email" value="{{ "" }}" class="form-control input-lg" placeholder="Email" required="">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <input type="password" name="password" id="password" class="form-control input-lg" placeholder="Password">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <label for="role" class="control-label">{{ "Role" }}</label>
                        <select name="role" id="role" class="form-control"><option value="Standard"{% if "Standard" == "Standard" %} selected{% endif %}>Standard</option><option value="Admin"{% if "Standard" == "Admin" %} selected{% endif %}>Admin</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-12">
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                    </div>
                </div>
            </fieldset>
            </form>
        </div>
    </div>
</div><!-- /.row -->
