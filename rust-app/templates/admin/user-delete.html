

<form method="post" action="{{ form_action }}" class="form-horizontal"><input type="hidden" name="_token" value="{{ session.csrf }}">{% if !form_method.is_empty() %}<input type="hidden" name="_method" value="{{ form_method }}">{% endif %}
<legend>
    Are you sure you want to delete user {{ user.field("email") }}? This process is irreversible.
</legend>
<div class="form-group">
    <a class="btn btn-default" href="{{ self.url("modUsers", &game.field("id"), &weapon.field("name"), &attachment.field("id"), &loadout.field("id"), &user.field("email")) }}">
        Cancel
    </a>
    <button type="submit" class="btn btn-danger">
        Delete
    </button>
</div>
</form>
