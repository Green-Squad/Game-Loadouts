

<div class="well">
    <form method="post" action="{{ form_action }}" class="form-horizontal"><input type="hidden" name="_token" value="{{ session.csrf }}">{% if !form_method.is_empty() %}<input type="hidden" name="_method" value="{{ form_method }}">{% endif %}
    <fieldset>
        <legend>
            <h2>Edit User</h2>
        </legend>
         <div class="form-group">
            <div class="col-lg-12">
                <input type="text" name="username" id="username" value="{{ user.field("username") }}" class="form-control input-lg" placeholder="Username" required="">
            </div>
        </div>
        <div class="form-group">
            <div class="col-lg-12">
                <input type="email" name="email" id="email" value="{{ user.field("email") }}" class="form-control input-lg" placeholder="Email" required="">
            </div>
        </div>
        <div class="form-group">
            <div class="col-lg-12">
                <input type="password" name="password" id="password" class="form-control input-lg" placeholder="Password">
            </div>
        </div>
        <div class="form-group">
            <div class="col-lg-6">
                <label for="role" class="control-label">{{ "Role" }}</label>
                <select name="role" id="role" class="form-control"><option value="Standard"{% if user.field("role") == "Standard" %} selected{% endif %}>Standard</option><option value="Admin"{% if user.field("role") == "Admin" %} selected{% endif %}>Admin</option></select>
            </div>
            <div class="col-lg-6">
                <label for="disabled_until" class="control-label">{{ "Disable For" }}</label>
                <select name="disabled_until" id="disabled_until" class="form-control"><option value="0"{% if user.field("role") == "0" %} selected{% endif %}>None</option><option value="30"{% if user.field("role") == "30" %} selected{% endif %}>30 Minutes</option><option value="60"{% if user.field("role") == "60" %} selected{% endif %}>1 Hour</option><option value="720"{% if user.field("role") == "720" %} selected{% endif %}>12 Hours</option><option value="1440"{% if user.field("role") == "1440" %} selected{% endif %}>1 Day</option><option value="10080"{% if user.field("role") == "10080" %} selected{% endif %}>1 Week</option><option value="43200"{% if user.field("role") == "43200" %} selected{% endif %}>1 Month</option><option value="525600000"{% if user.field("role") == "525600000" %} selected{% endif %}>1000 Years</option></select>
            </div>
        </div>
        <div class="form-group">
            <div class="col-lg-12">
                <button type="submit" class="btn btn-primary">
                    Save
                </button>
            </div>
        </div>
    </fieldset>
    </form>
</div>
